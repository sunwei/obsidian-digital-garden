{{ define "slot-head-extra" }}
{{- partial "commerce-scripts.html" . -}}
{{ end }}
{{ define "main" }}
<article class="single base-single mdf-commerce-page">
  <header class="single-header">
    <h1 class="single-title">{{ .Title | default (i18n "commerce.pricing.title") }}</h1>
  </header>
  <div class="single-content">
    {{- partial "encrypt-content.html" . -}}
    {{- $commerce := .Site.Params.commerce | default dict -}}
    <div
      id="mdf-pricing-root"
      class="mdf-commerce"
      data-endpoint="{{ $commerce.endpoint | default "" }}"
      data-project="{{ $commerce.project | default "" }}"
      data-privacy="{{ with $commerce.pages }}{{ partial "commerce-page-href.html" (.privacy | default "/privacy.html") }}{{ else }}{{ partial "commerce-page-href.html" "/privacy.html" }}{{ end }}"
      data-msg-buy="{{ i18n "commerce.buy" }}"
      data-msg-view="{{ i18n "commerce.view_content" }}"
      data-msg-test="{{ i18n "commerce.test_mode" }}"
      data-msg-one-time="{{ i18n "commerce.billing.one_time" }}"
      data-msg-month="{{ i18n "commerce.billing.month" }}"
      data-msg-year="{{ i18n "commerce.billing.year" }}"
      data-msg-confirm-title="{{ i18n "commerce.confirm.title" }}"
      data-msg-email="{{ i18n "commerce.confirm.email" }}"
      data-msg-email-invalid="{{ i18n "commerce.confirm.email_invalid" }}"
      data-msg-notice="{{ i18n "commerce.confirm.notice" }}"
      data-msg-privacy="{{ i18n "commerce.footer.privacy" }}"
      data-msg-pay="{{ i18n "commerce.confirm.pay" }}"
      data-msg-back="{{ i18n "commerce.confirm.back" }}"
      data-msg-unavailable="{{ i18n "commerce.confirm.unavailable" }}"
      data-msg-network="{{ i18n "commerce.confirm.network" }}"
    ></div>
  </div>
</article>
{{ end }}
