<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- base-head -->

<title>
  {{- if .IsHome -}}
    {{ .Site.Title }}{{ with .Site.Params.description }} — {{ . }}{{ end }}
  {{- else -}}
    {{ .Title }} | {{ .Site.Title }}
  {{- end -}}
</title>

{{- $isProtected := or .Params.password (eq .Params.access "protected") -}}
{{- $desc := .Description | default .Params.teaser | default .Site.Params.description -}}
{{- if and (not $isProtected) (not $desc) -}}
  {{- $desc = .PlainSummary -}}
{{- end -}}
<meta name="description" content="{{ $desc | default "" | truncate 155 "" }}">
<meta name="author" content="{{ .Site.Author.Name }}">

<link rel="canonical" href="{{ .Permalink }}">
{{- partial "head/favicon" . -}}
