- id: commerce.privacy.title
  translation: "Data & Privacy"
- id: commerce.privacy.section_title
  translation: "Purchases and access keys"
- id: commerce.privacy.lead
  translation: "This site is run by the publisher of {siteName}. For purchases, access keys, and your personal data, contact: {contactEmail}."
- id: commerce.privacy.incomplete
  translation: "This page will be complete once the publisher starts selling on this site."
- id: commerce.privacy.who_title
  translation: "Who is responsible for your data"
- id: commerce.privacy.who_author
  translation: "The publisher of this site manages your data: they issue and manage your access keys, and handle requests about your purchase, keys, and personal data."
- id: commerce.privacy.who_mdfriday
  translation: "MDFriday (mdfriday.com) provides hosting and selling tools for the publisher, and stores and processes this data on their behalf. It does not look at the data or use it for any purpose beyond what the publisher authorizes."
- id: commerce.privacy.who_creem
  translation: "Creem is the Merchant of Record and handles payment, tax, invoices, and refunds. Card details are processed only by Creem."
- id: commerce.privacy.collect_title
  translation: "Information collected at purchase"
- id: commerce.privacy.collect_body
  translation: "The email and name you enter at checkout, plus order details (item, amount, currency, time, and subscription status)."
- id: commerce.privacy.collect_use
  translation: "Used to issue an access key, let the publisher verify your purchase, and handle renewals, refunds, and after-sales requests. This does not add you to any mailing list."
- id: commerce.privacy.key_title
  translation: "Access keys"
- id: commerce.privacy.key_show
  translation: "The key is your credential for paid content. It is issued and managed by the publisher of this site. The key is shown on the payment completion page — please save it yourself."
- id: commerce.privacy.key_store
  translation: "After you enter the key on this site, it may be stored in the current browser so pages unlock automatically. Sign out on the unlock card or clear your browser data to remove it."
- id: commerce.privacy.key_lost
  translation: "If you lose the key, contact {contactEmail} using the email from your purchase. The publisher will verify and reissue it. MDFriday does not offer key recovery."
- id: commerce.privacy.subscribe_title
  translation: "Subscriptions"
- id: commerce.privacy.subscribe_body
  translation: "If you subscribe on this site, your email, the page you submitted from, referrer domain, country/region, and time are given to the publisher so they can send you updates. No cookie is set, and no IP address is stored."
- id: commerce.privacy.retain_title
  translation: "How long data is kept"
- id: commerce.privacy.retain_body
  translation: "Orders are kept for as long as this site exists, and deleted 30 days after the site is deleted. Payment records are kept by Creem under its own policy."
- id: commerce.privacy.rights_title
  translation: "Your rights"
- id: commerce.privacy.rights_body
  translation: "You can ask the publisher to view or correct your data, or to revoke your key. Contact {contactEmail}."
- id: commerce.privacy.updated
  translation: "Updated {updatedAt}"
